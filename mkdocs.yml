site_name: iodd_parse Docs
theme:
  name: material
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/oberth-effect/iodd-parser
repo_name: oberth-effect/iodd-parser

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - 'API Reference': reference.md
  - 'Helper functions': resolvers.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [ src ]
          options:
            docstring_style: sphinx
  - include-markdown
